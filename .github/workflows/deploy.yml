name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-progress runs for the same branch so only the latest deploy goes live
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Build / validate
  # ──────────────────────────────────────────────
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML (basic check)
        run: |
          echo "Checking for index.html..."
          test -f website/index.html && echo "index.html found." || (echo "ERROR: index.html missing!" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website   # only deploy the website/ folder

  # ──────────────────────────────────────────────
  # JOB 2: Deploy to GitHub Pages
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print live URL
        run: echo "Site live at ${{ steps.deployment.outputs.page_url }}"
